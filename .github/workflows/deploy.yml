name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Of de naam van je hoofdbranch
  workflow_dispatch:  # handmatig, bv. na een wijziging op nieuwe-stijl

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup Node ⚙️
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install and Build 🔧
        run: |
          npm install
          npm run build

      - name: Voorbeeld van branch nieuwe-stijl onder /voorbeeld/ 👀
        continue-on-error: true  # mag de gewone site nooit blokkeren
        run: |
          if git fetch --depth=1 origin nieuwe-stijl; then
            git worktree add "$RUNNER_TEMP/voorbeeld" FETCH_HEAD
            cd "$RUNNER_TEMP/voorbeeld"
            npm install
            VITE_VOORBEELD=1 npm run build -- --base=/voorbeeld/
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
            cp -r dist "$GITHUB_WORKSPACE/dist/voorbeeld"
          fi

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages # De branch waar de build naartoe gaat
